name: Extract video-only project archive

on:
  push:
    branches:
      - main
    paths:
      - PhotonCamera-video-only.zip
      - .github/workflows/extract-video-only-archive.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          test -s PhotonCamera-video-only.zip
          mkdir -p .extract-tmp
          unzip -q PhotonCamera-video-only.zip -d .extract-tmp

          top_entry_count="$(find .extract-tmp -mindepth 1 -maxdepth 1 | wc -l)"
          if [ "$top_entry_count" -eq 1 ] && [ -d "$(find .extract-tmp -mindepth 1 -maxdepth 1 -type d -print -quit)" ]; then
            source_dir="$(find .extract-tmp -mindepth 1 -maxdepth 1 -type d -print -quit)"
          else
            source_dir=".extract-tmp"
          fi

          rsync -a --exclude='.git/' "$source_dir"/ ./
          rm -rf .extract-tmp

          echo "Extracted project root:"
          find . -maxdepth 2 -type f | sort | head -200

      - name: Commit extracted source files
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Archive contents already exist; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract video-only camera project"
          git push origin "HEAD:${GITHUB_REF_NAME}"
